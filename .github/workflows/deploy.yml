name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
  NOTIFY_DISPATCH_SECRET: ${{ secrets.NOTIFY_DISPATCH_SECRET }}

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy-supabase:
    runs-on: ubuntu-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - name: Push database migrations
        run: supabase db push
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-checkout --use-api
          supabase functions deploy stripe-webhook --no-verify-jwt --use-api
          supabase functions deploy billing-portal --use-api
          supabase functions deploy send-notifications --no-verify-jwt --use-api
          supabase functions deploy provider-payouts --use-api
          supabase functions deploy rate-limit --no-verify-jwt --use-api
          supabase functions deploy health-check --no-verify-jwt --use-api
      - name: Set Vault secrets
        run: |
          supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          supabase secrets set STRIPE_WEBHOOK_SIGNING_SECRET="$STRIPE_WEBHOOK_SIGNING_SECRET"
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY"
          supabase secrets set NOTIFY_FROM_EMAIL="$NOTIFY_FROM_EMAIL"
          supabase secrets set NOTIFY_DISPATCH_SECRET="$NOTIFY_DISPATCH_SECRET"

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: deploy-supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Deploy to Vercel
        uses: vercel/action-deploy@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-vercel
    steps:
      - name: Wait for deployment
        run: sleep 30
      - name: Check health endpoint
        run: |
          curl -f ${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/health || exit 1
