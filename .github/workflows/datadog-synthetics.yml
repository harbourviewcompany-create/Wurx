name: Production verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-verification:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      PRODUCTION_BASE_URL: https://wurx.vercel.app

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify Datadog credentials are configured
        shell: bash
        run: |
          missing=()
          [[ -n "$DD_API_KEY" ]] || missing+=("DD_API_KEY")
          [[ -n "$DD_APP_KEY" ]] || missing+=("DD_APP_KEY")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            printf 'Configure them under Repository settings > Secrets and variables > Actions.\n' >&2
            exit 1
          fi

      - name: Run production HTTP smoke checks
        run: node scripts/production-http-smoke.mjs

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
