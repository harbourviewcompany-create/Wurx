name: UI QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rzdavbuoisckvdapbcbj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_x4MUHQBn3ceycJKfWu--jw_r3N5kyCz
      NEXT_PUBLIC_SITE_URL: https://wurx.vercel.app
      PLAYWRIGHT_SERVER_COMMAND: npm run start
      WURX_UI_QA: '1'
      WURX_VISUAL_BASELINES: '0'
      WURX_E2E_HOMEOWNER_EMAIL: ${{ secrets.WURX_E2E_HOMEOWNER_EMAIL }}
      WURX_E2E_HOMEOWNER_PASSWORD: ${{ secrets.WURX_E2E_HOMEOWNER_PASSWORD }}
      WURX_E2E_PROFESSIONAL_EMAIL: ${{ secrets.WURX_E2E_PROFESSIONAL_EMAIL }}
      WURX_E2E_PROFESSIONAL_PASSWORD: ${{ secrets.WURX_E2E_PROFESSIONAL_PASSWORD }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Provision ephemeral non-production QA identities
        env:
          HOMEOWNER_EMAIL: tylercampbell5+wurx-qa-homeowner-ffeb6967c526@outlook.com
          HOMEOWNER_PASSWORD: WqH!10J#G-Cnh6Oe1bqQ1FdD!_Pr#!N0
          PROFESSIONAL_EMAIL: tylercampbell5+wurx-qa-professional-e54353c69f70@outlook.com
          PROFESSIONAL_PASSWORD: WqP!e5FBX0fRwQwdFZdhqd76VX9%u51F
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = f"{os.environ['NEXT_PUBLIC_SUPABASE_URL']}/auth/v1/signup"
          headers = {
              'apikey': os.environ['NEXT_PUBLIC_SUPABASE_ANON_KEY'],
              'Content-Type': 'application/json',
          }
          accounts = [
              ('HOMEOWNER_EMAIL', 'HOMEOWNER_PASSWORD', 'Alexandria Quality Assurance Homeowner-McAllister'),
              ('PROFESSIONAL_EMAIL', 'PROFESSIONAL_PASSWORD', 'Morgan Professional Quality Assurance'),
          ]
          for email_key, password_key, full_name in accounts:
              payload = json.dumps({
                  'email': os.environ[email_key],
                  'password': os.environ[password_key],
                  'data': {'full_name': full_name},
              }).encode()
              request = urllib.request.Request(endpoint, data=payload, headers=headers, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"QA identity request completed with HTTP {response.status}.")
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  if error.code in (400, 422) and ('already' in body.lower() or 'registered' in body.lower()):
                      print('QA identity already exists.')
                  else:
                      raise RuntimeError(f"QA identity request failed with HTTP {error.code}: {body}") from error
          PY

      - name: Install locked application and QA dependencies
        run: npm ci

      - name: Install WebKit runtime dependencies
        run: npx playwright install --with-deps webkit

      - name: Build production application
        run: npm run build

      - name: Capture responsive UI without baseline comparison during account setup
        run: npm run test:ui

      - name: Create screenshot manifest
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          find artifacts/screenshots -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > artifacts/screenshots/SHA256SUMS.txt
          find artifacts/screenshots -type f -maxdepth 3 | sort

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: wurx-ui-qa-${{ github.run_id }}
          path: |
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: warn
          retention-days: 21
