name: UI QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rzdavbuoisckvdapbcbj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_x4MUHQBn3ceycJKfWu--jw_r3N5kyCz
      NEXT_PUBLIC_SITE_URL: https://wurx.vercel.app
      PLAYWRIGHT_SERVER_COMMAND: npm run start
      WURX_UI_QA: '1'
      WURX_VISUAL_BASELINES: '0'
      WURX_E2E_HOMEOWNER_EMAIL: tylercampbell5+wurx-qa-homeowner-ffeb6967c526@outlook.com
      WURX_E2E_HOMEOWNER_PASSWORD: WqH!10J#G-Cnh6Oe1bqQ1FdD!_Pr#!N0
      WURX_E2E_PROFESSIONAL_EMAIL: tylercampbell5+wurx-qa-professional-e54353c69f70@outlook.com
      WURX_E2E_PROFESSIONAL_PASSWORD: WqP!e5FBX0fRwQwdFZdhqd76VX9%u51F

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Finalize source cleanup on the PR branch
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('app/dashboard/page.tsx')
          text = dashboard.read_text()
          text = text.replace(
              "import { CalendarDays, Check, CheckCircle2, House, ShieldCheck, Sparkles, UserRound } from 'lucide-react'",
              "import { Check, CheckCircle2, House, ShieldCheck, Sparkles, UserRound } from 'lucide-react'",
          )
          text = text.replace(
              "searchParams: Promise<{ success?: string; booked?: string }>",
              "searchParams: Promise<{ success?: string; booked?: string; qaState?: string }>",
          )
          needle = "  const justBooked = params.booked === '1' || params.booked === 'true'\n"
          if "const qaState = process.env.WURX_UI_QA" not in text:
              text = text.replace(
                  needle,
                  needle + "  const qaState = process.env.WURX_UI_QA === '1' ? params.qaState : undefined\n  if (qaState === 'error') throw new Error('Wurx dashboard QA error state')\n  if (qaState === 'loading') await new Promise((resolve) => setTimeout(resolve, 1_500))\n",
                  1,
              )
          dashboard.write_text(text)

          provider = Path('app/provider/dashboard/page.tsx')
          text = provider.read_text()
          old = """  const offers = (offersRes.data ?? [])
    .map((offer) => {
      const booking = (offer.bookings ?? null) as BookingSnippet | null
      return { id: offer.id, expires_at: offer.expires_at, booking }
    })
    .filter((offer) => offer.booking && offer.booking.status === 'requested' && !offer.booking.provider_id)

  const offeredBookingIds = new Set(offers.map((offer) => offer.booking!.id))
"""
          new = """  const offers = (offersRes.data ?? []).flatMap((offer) => {
    const booking = (offer.bookings ?? null) as BookingSnippet | null
    if (!booking || booking.status !== 'requested' || booking.provider_id) return []
    return [{ id: offer.id, expires_at: offer.expires_at, booking }]
  })

  const offeredBookingIds = new Set(offers.map((offer) => offer.booking.id))
"""
          text = text.replace(old, new, 1)
          text = text.replace("            const booking = offer.booking!\n", "            const booking = offer.booking\n", 1)
          provider.write_text(text)
          PY
          rm -f .github/workflows/pr64-lock-refresh.yml .github/workflows/pr64-code-cleanup.yml
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/dashboard/page.tsx app/provider/dashboard/page.tsx .github/workflows
            git commit -m 'fix(qa): finalize lint cleanup and gated QA states'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install locked application and QA dependencies
        run: npm ci

      - name: Install stable Chrome and WebKit runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Build production application
        run: npm run build

      - name: Capture authenticated Chrome and WebKit release matrix
        run: npm run test:ui

      - name: Create screenshot manifest
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          find artifacts/screenshots -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > artifacts/screenshots/SHA256SUMS.txt
          find artifacts/screenshots -type f -maxdepth 3 | sort

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: wurx-ui-qa-${{ github.run_id }}
          path: |
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: warn
          retention-days: 21
