name: UI QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rzdavbuoisckvdapbcbj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_x4MUHQBn3ceycJKfWu--jw_r3N5kyCz
      NEXT_PUBLIC_SITE_URL: https://wurx.vercel.app
      PLAYWRIGHT_SERVER_COMMAND: npm run start
      WURX_E2E_EMAIL: ${{ secrets.WURX_E2E_EMAIL }}
      WURX_E2E_PASSWORD: ${{ secrets.WURX_E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install browser QA tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Capture responsive UI and run accessibility checks
        run: npm run test:ui

      - name: Create screenshot manifest
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          find artifacts/screenshots -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > artifacts/screenshots/SHA256SUMS.txt
          find artifacts/screenshots -type f -maxdepth 3 | sort

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: wurx-ui-qa-${{ github.run_id }}
          path: |
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: warn
          retention-days: 21
