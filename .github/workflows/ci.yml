name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repo is public, so GitHub's native secret scanning already
      # auto-revokes known partner token formats (e.g. GitHub PATs, Stripe
      # keys) on push. Gitleaks here is defense-in-depth for secrets that
      # scanning doesn't catch: DATABASE_URL passwords, custom API keys,
      # SUPABASE_SERVICE_ROLE_KEY, etc. Fails the build on any match.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Runs against the whole repo, including files not wired into any
      # Next.js route (e.g. backend/src/**). next build's typecheck only
      # covers files reachable from the app's route graph, so this step
      # catches dead-but-broken code that next build would silently skip.
      - name: Typecheck (tsc)
        run: npx tsc --noEmit -p tsconfig.json

      # next build runs its own TypeScript check plus actually compiles the
      # app. DATABASE_URL is required for @prisma/client to construct at
      # module load (lib/db.ts). No live DB connection is made during build,
      # so a syntactically valid placeholder is sufficient here — this is
      # NOT a real credential and must not be treated as one.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_build_placeholder"
