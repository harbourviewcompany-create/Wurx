# Supabase local/CLI config for the Wurx project (ref: rzdavbuoisckvdapbcbj).
project_id = "rzdavbuoisckvdapbcbj"

# Stripe checkout — requires a signed-in user, so keep JWT verification on.
[functions.create-checkout]
verify_jwt = true

# Stripe webhook — Stripe cannot present a Supabase JWT; it is authenticated by
# the webhook signature inside the function. JWT verification must stay OFF.
[functions.stripe-webhook]
verify_jwt = false

# Manual replay operates only on previously signature-verified inbox events and
# is restricted to authenticated Wurx admins inside the function.
[functions.stripe-replay]
verify_jwt = true

# Provider onboarding, status, and admin payouts require an authenticated caller.
[functions.provider-payouts]
verify_jwt = true
